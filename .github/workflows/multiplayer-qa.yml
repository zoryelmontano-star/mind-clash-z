name: Multiplayer Question QA
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quiz-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out game code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify every quiz category and multiplayer tally
        run: node qa-multiplayer.cjs
